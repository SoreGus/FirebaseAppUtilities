[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "firebase-app-utilities"
version = "0.2.0"
description = "Reusable Firebase tooling, analytics, project inspection and modern desktop utilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Gustavo" }
]
dependencies = [
  "firebase-admin>=6.5,<8",
  "requests>=2.32,<3",
  "PySide6>=6.8,<7"
]

[project.scripts]
firebase-app-utils = "firebase_app_utilities.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firebase_app_utilities"]
